<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f7fc;--card:#fff;--ink:#0f2747;--mut:#5a6b85;--acc:#0b3a73;--accbg:#e3eef9;--ok:#1b7f4b;--okbg:#dff3e7;--bad:#b3261e;--badbg:#fbe4e2;--line:#d3deec;--onacc:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1a2e;--card:#12263f;--ink:#e8f0fa;--mut:#a3b4cc;--acc:#4db8e8;--accbg:#16385c;--ok:#6fd39a;--okbg:#17352a;--bad:#ff8f86;--badbg:#3a1d1d;--line:#27405e;--onacc:#06192e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1a2e;--card:#12263f;--ink:#e8f0fa;--mut:#a3b4cc;--acc:#4db8e8;--accbg:#16385c;--ok:#6fd39a;--okbg:#17352a;--bad:#ff8f86;--badbg:#3a1d1d;--line:#27405e;--onacc:#06192e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 56px}
h1{font:700 27px/1.15 Georgia,serif;margin:8px 0 6px}h2{font:700 19px/1.25 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.sec b{display:block;margin-bottom:6px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 3px}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:600px){.g2{grid-template-columns:1fr}}
.cat{background:var(--accbg);border-radius:8px;padding:8px 12px;font-size:14px;margin-top:8px}.cat div{margin:2px 0}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.chip{border:1.5px dashed var(--acc);background:transparent;color:var(--ink);border-radius:8px;padding:8px 11px;text-align:left;font:inherit;font-size:14px;cursor:pointer}
.btn{border:0;background:var(--acc);color:var(--onacc);border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}.btn.del{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.fm{background:var(--accbg);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:15px}
.ck{list-style:none;padding:0;margin:6px 0 0;font-size:14px}.ck li{padding:3px 0}.ck .y{color:var(--ok)}.ck .n{color:var(--bad)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sc{font-weight:700;padding:3px 10px;border-radius:999px;background:var(--badbg)}.sc.f{background:var(--okbg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}th{background:var(--accbg)}
.sm{font-size:13px;color:var(--mut)}.ov{overflow-x:auto}
#pj{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) 28px max(24px,env(safe-area-inset-bottom,0px))}
.pjbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:8px 0}
.pjt{color:var(--acc);font-weight:700;font-size:clamp(16px,2vw,24px);margin-top:12px}
.pjh{font:700 clamp(26px,4vw,52px)/1.15 Georgia,serif;margin:8px 0 20px}
.pjg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px 28px}
.pjf{border-left:4px solid var(--acc);padding-left:14px}.pjl{color:var(--mut);font-size:clamp(14px,1.4vw,20px)}
.pjv{font-size:clamp(18px,2.2vw,32px);line-height:1.3}.pjs{margin-top:24px;color:var(--mut);font-size:clamp(14px,1.4vw,20px)}
.hero{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-top:6px solid #f59a1b;border-radius:14px;padding:14px 18px;margin:0 0 16px;box-shadow:0 2px 12px rgba(11,58,115,.10)}
.hero img{width:104px;height:104px;border-radius:10px;flex:none;background:#f7f7f7}.hero h1{margin:0 0 4px;color:var(--acc)}.hero .sub{margin:0}
@media(max-width:520px){.hero{flex-direction:column;text-align:center}}
h2{color:var(--acc)}.card{box-shadow:0 1px 6px rgba(11,58,115,.07)}
.sec b{border-left:4px solid #f59a1b;padding-left:8px}
.btn{border-radius:999px;padding:10px 22px}.btn:hover{filter:brightness(1.12)}
th{background:var(--acc);color:var(--onacc)}
.fm,.cat{border-left:4px solid #00a3d9}
.ft{max-width:820px;margin:0 auto;padding:0 16px 32px;text-align:center;color:var(--mut);font-size:13px}
.pjlogo{height:56px;border-radius:8px}.pjh{color:var(--acc)}#pj{border-top:8px solid #f59a1b}
</style>

<div id="pj" hidden role="dialog" aria-label="Proyección de respuestas"><div class="pjbar"><img class="pjlogo" id="pjlogo" alt="LABPP"><button class="btn alt" onclick="pjGo(-1)">‹ Anterior</button><span id="pjn" class="sm"></span><button class="btn alt" onclick="pjGo(1)">Siguiente ›</button><span style="flex:1"></span><button class="btn alt" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">Pantalla completa</button><button class="btn" onclick="pjClose()">Cerrar</button></div><div id="pjb"></div></div>
<footer class="ft">LABPP · Laboratorio de Políticas Públicas · MINPRE · República Dominicana</footer>
<script>
const $=id=>document.getElementById(id);const E=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const M=[
{m:"Salud y larga vida",c:["Tasa de mortalidad infantil · 20.68 (2025) · meta 2028: 13","Tasa de mortalidad neonatal · 21.7 (2023) · sin meta","Esperanza de vida al nacer · 75.51 (2025) · meta 2028: 77"]},
{m:"Seguridad y libertad",c:["Tasa de feminicidios por 100 mil mujeres · 1.01 (2025) · meta 2028: 0.98","Tasa de homicidios intencionales · 8.15 (2025) · meta 2028: 7.3","Tasa de actos delictivos por 100 mil hab. · incluye violencia intrafamiliar, pero agrupa muchos delitos","Vacío: no hay indicador priorizado de violencia contra NNA"]},
{m:"Vivienda y servicios básicos",c:["Porcentaje de déficit habitacional cualitativo · 27.55 (2024) · meta 2028: 21.87","Hogares que reciben agua potable más de 3 días a la semana · 40.07 (2024) · meta 2028: 60","Hogares con 20 a 24 horas de energía por día · 79.91 (2024) · meta 2028: 87","Índice de saneamiento básico aceptable · 74.64 (2024) · meta 2028: 80"]},
{m:"Clase media robusta",nt:"En el catálogo la meta aparece como «Más clase media y menos pobreza o hambre».",c:["Peso de la clase media en la población · 50.44 (2025) · meta 2028: 50","Tasa de pobreza monetaria general · 17.26 (2025) · meta 2028: 15","Tasa de pobreza extrema · 2.2 (2025) · meta 2028: 1","Prevalencia de la subalimentación · 2.5 (2024) · meta 2028: 2.5"]},
{m:"Crecimiento económico y productividad sostenible",nt:"En el catálogo la meta aparece como «Mayor crecimiento económico». Es la menos directa para niñez; úsala si tu equipo ve un vínculo.",c:["PIB per cápita (US$) · 11,753.84 (2025) · meta 2028: 15,000","Monto total de las exportaciones (millones US$) · 15,957.6 (2025) · meta 2028: 17,000","Flujo de inversión extranjera directa (millones US$) · 5,032.3 (2025) · meta 2028: 5,000"]},
{m:"Formalidad laboral",nt:"En el catálogo la meta aparece como «Mayor empleo de calidad e inclusivo».",c:["Tasa de formalidad en el empleo · 45.9 (2025) · meta 2028: 50","Jóvenes de 15 a 24 años que no estudian y están desempleados · 18.58 (2025) · meta 2028: 15","Personas ocupadas en mipymes formales · 921,401 (2025) · meta 2028: 1,000,000"]},
{m:"Educación de calidad",nt:"En el catálogo la meta aparece como «Más calidad en la educación, más alineada a los sectores productivos».",c:["Tasa neta de cobertura nivel inicial (3 a 5 años) · 61.3 (2025) · meta 2028: 62.45","Tasa neta de cobertura primera infancia (0 a 2 años) · 7.6 (2025) · meta 2028: 30.47","Tasa neta de cobertura nivel secundario (12 a 17 años) · 71.6 (2025) · meta 2028: 82.56","Estudiantes de 3er grado con resultado mayor a elemental en Lengua · 48.9 (2023) · meta 2028: 70"]},
{m:"Más dignidad: avanzar hacia el bienestar multidimensional",nt:"El catálogo no trae esta meta con ese nombre. Los indicadores de abajo son los más cercanos (por confirmar su asociación).",c:["Hogares pobres e indigentes multidimensionales (ICV), zona rural · 17.42 (2025) · meta 2028: 15","Índice de Desarrollo Sostenible · 73.02 (2025) · meta 2028: 80","Población adulta mayor con cobertura de seguridad social · 95.02 (2024) · sin meta"]},
{m:"Reducir la vulnerabilidad climática",nt:"En el catálogo la meta aparece como «Resilientes ante los choques climáticos».",c:["Personas con Índice de Vulnerabilidad ante Choques Climáticos bajo · 62.4 (2024) · meta 2028: 75","Energía renovable en la generación total · 19.99 (2025) · meta 2028: 25","Superficie de cuencas bajo manejo (km²) · 181 (2025) · meta 2028: 150"]},
{m:"Un Estado moderno, transparente y eficiente",nt:"En el catálogo la meta aparece como «Ante incertidumbre económica: un Gobierno más efectivo».",c:["Índice de efectividad del Gobierno · 52.79 (2024) · meta 2028: 61","Puntuación promedio de la EDI · 75.41 (2025) · meta 2028: 80","Índice de Percepción de la Corrupción · 37 (2025) · meta 2028: 45","Índice de progreso de las políticas del PNPSP · 76.42 (2025) · meta 2028: 80"]}];
const T=["Insumo","Proceso","Producto","Resultado","Impacto"],U=["Porcentaje","Tasa","Razón","Enumeración","Sí/No"],K=["× 100","× 1,000","× 100,000"],P=["Mensual","Trimestral","Semestral","Anual"],L=["Por establecer con el primer corte de datos confiable","Calculada: documentar año, fuente y filtros"];
function fo(x){return x.num?(x.den?`(${x.num} ÷ ${x.den})${x.k?" "+x.k.replace("×","×"):""}`:`Conteo de: ${x.num}`):"Completa numerador y denominador"}
function ck(x){return [
["Meta elegida y explicación de cómo afecta a NNA",!!(x.m&&(x.vin||"").length>8)],
["Resultado esperado descrito",x.res.length>8],
["Pregunta de gestión que el indicador responde",x.pr.length>8],
["El nombre expresa la medida, menciona a NNA y no empieza con un verbo de objetivo (reducir, mejorar…)",x.nom.length>10&&/(nna|ni[ñn]|adolescen|menores)/i.test(x.nom)&&!/^(reducir|mejorar|aumentar|fortalecer|garantizar|lograr|disminuir|incrementar|promover)/i.test(x.nom.trim())],
["Tipología coherente: indicador de resultado",x.tip==="Resultado"],
["Numerador y denominador definidos (o conteo directo)",!!x.num&&(!!x.den||x.um==="Enumeración")],
["Constante coherente con la unidad (porcentaje × 100; tasa × 1,000 o × 100,000)",x.um==="Porcentaje"?x.k==="× 100":x.um==="Tasa"?(x.k==="× 1,000"||x.k==="× 100,000"):!!x.um],
["Dirección esperada, periodicidad y fuente con responsable",!!x.dir&&!!x.per&&x.fu.length>3],
["Limitaciones y vacíos documentados",x.li.length>5],
["Validación pendiente: quién verifica qué",x.va.length>3]]}
let DOCS=[];
const HA=["Equipo","Meta prioritaria","Vínculo con NNA","Resultado esperado","Pregunta de gestión","Indicador propuesto","Tipología","Unidad","Fórmula","Dirección","Periodicidad","Fuente","Línea base","Meta","Limitaciones","Validación","Controles"];
const rowA=(t,x)=>[t,x.m,x.vin,x.res,x.pr,x.nom,x.tip,x.um,fo(x),x.dir,x.per,x.fu,x.lb,x.mt,x.li,x.va,ck(x).filter(z=>z[1]).length+"/10"];
function flat(){const m=$("fa").value;let r=[];DOCS.forEach(d=>d.inds.forEach(x=>{if(!m||x.m===m)r.push(rowA(d.team,x))}));return r.sort((a,b)=>a[0].localeCompare(b[0]))}
function rA(){const r=flat();const eq=new Set(r.map(x=>x[0]));
$("asum").textContent=`${DOCS.length} equipos han enviado respuestas · ${r.length} indicadores en la vista actual`;
const by={};r.forEach(x=>{const o=by[x[1]]||(by[x[1]]={n:0,t:new Set,c:0});o.n++;o.t.add(x[0]);o.c+=parseInt(x[16])});
$("by").innerHTML=`<table><tr><th>Meta</th><th>Indicadores</th><th>Equipos</th><th>Controles promedio</th></tr>${Object.keys(by).sort().map(k=>`<tr><td>${E(k||"(sin meta)")}</td><td>${by[k].n}</td><td>${by[k].t.size}</td><td>${(by[k].c/by[k].n).toFixed(1)}/10</td></tr>`).join("")||"<tr><td colspan=4>Aún no hay respuestas.</td></tr>"}</table>`;
$("all").innerHTML=`<table><tr>${HA.map(h=>`<th>${h}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${E(c)}</td>`).join("")}</tr>`).join("")}</table>`;
$("atsv").value=[HA,...r].map(x=>x.join("\t")).join("\n");if(PJ.on)pj()}
function cpA(){const t=$("atsv");t.hidden=false;t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}t.hidden=true;$("cpa").textContent=ok?"Copiado.":"No se pudo copiar; usa Descargar CSV."}
const PJ={on:false,i:0};
function pjOpen(){$("pjlogo").src=document.querySelector(".hero img").src;PJ.on=true;PJ.i=0;$("pj").hidden=false;pj()}
function pjClose(){PJ.on=false;$("pj").hidden=true;if(document.fullscreenElement)document.exitFullscreen()}
function pjGo(d){const n=flat().length;if(n){PJ.i=(PJ.i+d+n)%n;pj()}}
function pj(){const r=flat();if(!r.length){$("pjb").innerHTML='<p class="pjv">Aún no hay respuestas para mostrar.</p>';$("pjn").textContent="";return}
if(PJ.i>=r.length)PJ.i=r.length-1;const x=r[PJ.i];$("pjn").textContent=`${PJ.i+1} de ${r.length}`;
const B=(l,v)=>v?`<div class="pjf"><div class="pjl">${l}</div><div class="pjv">${E(v)}</div></div>`:"";
$("pjb").innerHTML=`<div class="pjt">${E(x[0])} · ${E(x[1])}</div><h2 class="pjh">${E(x[5]||"(sin nombre del indicador)")}</h2><div class="pjg">${B("Cómo afecta a NNA",x[2])}${B("Resultado esperado",x[3])}${B("Pregunta de gestión",x[4])}${B("Fórmula",x[8])}${B("Tipo, dirección y periodicidad",[x[6],x[9],x[10]].filter(Boolean).join(" · "))}${B("Fuente",x[11])}${B("Línea base y meta",[x[12],x[13]].filter(Boolean).join(" · "))}${B("Limitaciones",x[14])}${B("Validación pendiente",x[15])}</div><div class="pjs">Revisión automática: ${x[16]}</div>`}
document.addEventListener("keydown",e=>{if(!PJ.on)return;if(e.key==="ArrowRight")pjGo(1);else if(e.key==="ArrowLeft")pjGo(-1);else if(e.key==="Escape")pjClose()});
function dl(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const csv="\ufeff"+[HA,...flat()].map(r=>r.map(q).join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="respuestas_indicadores.csv";a.click()}
</script>
<script type="module">
const firebaseConfig={apiKey:"PEGA_AQUI",authDomain:"TU-PROYECTO.firebaseapp.com",projectId:"TU-PROYECTO",appId:"PEGA_AQUI"};
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=getFirestore(initializeApp(firebaseConfig));
$("fa").innerHTML='<option value="">Todas las metas</option>'+M.map(z=>`<option>${z.m}</option>`).join("");
onSnapshot(collection(db,"respuestas"),sn=>{DOCS=sn.docs.map(d=>{const x=d.data();let n=[];try{n=JSON.parse(x.inds)}catch(e){}return{team:x.team||"(sin nombre)",inds:n}});rA()},e=>{$("asum").textContent="No se pudieron leer las respuestas. Revisa las reglas de Firestore y la configuración."});
</script></body></html>
